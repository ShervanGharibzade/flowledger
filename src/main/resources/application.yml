spring:
  application:
    name: flow-ledger

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Only expose what's needed for health checks / basic diagnostics.
        # Add endpoints deliberately, don't switch this to "*".
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    org.fl.flowledger: INFO

app:
  # RSA key pair (PEM) used to sign/verify access tokens. Required for prod
  # and for any multi-instance deployment - see JwtKeyConfig for details.
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cookie:
    # Whether the refresh_token cookie requires HTTPS. Keep true everywhere
    # except local HTTP development.
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# Local development profile - matches docker-compose.yml defaults so
# `docker compose up` + this profile works out of the box. Never used
# automatically outside of an explicit dev/local setup.
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/flowledger
    username: flowledger
    password: flowledger

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

app:
  cookie:
    secure: false

---
# Production profile - every value is sourced from the environment /
# secret manager. There are intentionally no defaults here: the app should
# fail to start rather than silently fall back to dev-like settings.
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
